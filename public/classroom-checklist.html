<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>태블릿 점검표 · 꼭꼭 아지트</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style>*{box-sizing:border-box;word-break:keep-all;font-variant-numeric:tabular-nums}body{font:18px/1.8 Pretendard,sans-serif;max-width:780px;margin:40px auto;padding:24px;color:#202b2d;background:#f5f6f7}li{margin:16px 0}label{display:flex;align-items:flex-start;gap:12px;user-select:none}input{width:24px;height:24px;flex-shrink:0;accent-color:#16776b}button{font:inherit;padding:12px 20px;background:#16776b;color:#fff;border:0;border-radius:10px;white-space:nowrap;user-select:none;outline:none}button:focus-visible,input:focus-visible{outline:none;box-shadow:0 0 0 3px #16776b55}@media print{body{background:#fff}button{display:none}}</style></head><body><h1>태블릿 점검표</h1><p>교실 기기·와이파이 사전 점검</p><p>날짜: __________　기기 모델: __________　학생 수: ____명</p><ol><li><label><input type="checkbox">5명 접속 · 이동·색칠·발사 터치 조작 확인</label></li><li><label><input type="checkbox">우리 반 입장 방 지정 · 이름 입력 후 입장 확인</label></li><li><label><input type="checkbox">10명·20명 순차 접속 · 각 3분 진행 · 끊김 기기·시간 기록</label></li><li><label><input type="checkbox">가벼운 화면 설정 확인 · 기기별 움직임 비교</label></li><li><label><input type="checkbox">숨기 시간 종료 후 술래 자동 출발 확인</label></li><li><label><input type="checkbox">발견 후 관전 · 다음 경기 재참여 확인</label></li><li><label><input type="checkbox">선생님 일시정지·재개의 전체 기기 반영 확인</label></li><li><label><input type="checkbox">모두 종료 후 친구 방·개인 연습 중단 · 재입장 제한 확인</label></li><li><label><input type="checkbox">게임 재개 후 기존 방 종료 유지 · 새 방 지정</label></li></ol><p>끊김·조작 문제: __________________________________</p><p>술래 수: ____명　숨기: ____분　찾기: ____분</p><button onclick="window.print()">점검표 인쇄</button></body></html>
