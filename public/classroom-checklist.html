<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>첫 수업 점검표 · 꼭꼭 아지트</title><style>body{font:18px/1.8 system-ui;max-width:780px;margin:40px auto;padding:24px;color:#203b31}li{margin:16px 0}input{width:22px;height:22px}button{font:inherit;padding:12px}@media print{button{display:none}}</style><h1>첫 수업 태블릿 점검표</h1><p>실제 교실의 태블릿과 와이파이에서 선생님이 확인하는 항목입니다. 자동 검사만으로 교실 환경의 성능을 보장할 수는 없어요.</p><p>날짜: __________　기기 모델: __________　학생 수: ____명</p><ol><li><label><input type="checkbox"> 먼저 5명으로 접속해 이동·색칠·발사가 손가락으로 되는지 확인해요.</label></li><li><label><input type="checkbox"> 선생님 화면에서 방을 ‘우리 반 입장 버튼으로 지정’한 뒤, 학생들이 이름만 쓰고 입장하는지 확인해요.</label></li><li><label><input type="checkbox"> 10명, 20명 순서로 늘려 3분씩 진행해요. 끊기는 기기와 발생 시간을 기록해요.</label></li><li><label><input type="checkbox"> 메뉴의 ‘가벼운 화면 켜짐’을 확인해요. 같은 기기에서 껐다 켜며 움직임을 비교해요.</label></li><li><label><input type="checkbox"> 숨기 시간이 끝나면 미준비 학생이 있어도 술래가 출발하는지 확인해요.</label></li><li><label><input type="checkbox"> 잡힌 학생이 친구를 골라 관전하고, 다음 판에 다시 참여하는지 확인해요.</label></li><li><label><input type="checkbox"> 선생님 일시정지·이어하기가 모든 태블릿에 반영되는지 확인해요.</label></li><li><label><input type="checkbox"> ‘모두 종료’를 누르면 친구 방과 혼자 연습이 중단되고 새로고침해도 못 들어가는지 확인해요.</label></li><li><label><input type="checkbox"> 다시 열기 후 이전 방이 되살아나지 않는지 확인하고, 새 방을 지정해요.</label></li></ol><p>끊김·조작이 어려웠던 점: __________________________________</p><p>적당했던 술래 수: ____명　숨기: ____분　찾기: ____분</p><button onclick="window.print()">점검표 인쇄</button></html>
